version: '3.8'

# --- Netzwerk-Konfiguration ---
networks:
  timescale_default:
    external: true
    name: timescale_default

# --- Volumes für persistente Daten ---
volumes:
  n8n_data: {}
  ollama_data: {}

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_HOST:-timescaledb}
      - DB_POSTGRESDB_PORT=${DB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-athlete_metrics}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=Europe/Berlin
      - NODE_OPTIONS=--max-old-space-size=4096
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change_me}
      - N8N_HOST=0.0.0.0
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:5678:5678"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: 1.5
        reservations:
          memory: 1G
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: 3.0
        reservations:
          memory: 2G
          cpus: 1.0
    healthcheck:
      test: ["CMD", "ollama", "list"]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


  # MCP-Server (Fitness-Datenquellen)
  polar-mcp:
    build:
      context: ./mcp-servers/polar-mcp-server
      dockerfile: Dockerfile
    container_name: polar-mcp
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - POLAR_CLIENT_ID=${POLAR_CLIENT_ID:-dummy_id}
      - POLAR_CLIENT_SECRET=${POLAR_CLIENT_SECRET:-dummy_secret}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


  intervals-mcp:
    build:
      context: ./mcp-servers/intervals.icu-mcp-server
      dockerfile: Dockerfile
    container_name: intervals-mcp
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - INTERVALS_KEY=${INTERVALS_KEY:-dummy_key}
      - ATHLETE_ID=${ATHLETE_ID:-dummy_id}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


  cronometer-mcp:
    build:
      context: ./mcp-servers/cronometer
      dockerfile: Dockerfile
    container_name: cronometer-mcp
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      - CRONOMETER_USERNAME=${CRONOMETER_USERNAME:-dummy_user}
      - CRONOMETER_PASSWORD=${CRONOMETER_PASSWORD:-dummy_password}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


  mcp-server:
    build:
      context: ./mcp-servers/mcp-server
    container_name: mcp-server
    environment:
      - DB_HOST=${DB_HOST:-timescaledb}
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-athlete_metrics}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - MCP_SERVER_PORT=8000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:8009:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - timescale_default