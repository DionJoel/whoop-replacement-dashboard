version: '3.8'

# --- Netzwerk-Konfiguration ---
networks:
  timescale_default: # Verbindet sich mit dem Netzwerk des 'timescale' Stacks
    external: true
    name: timescale_default

# --- Volumes für persistente Daten ---
volumes:
  n8n_data:
    driver: local
  ollama_data:
    driver: local

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_HOST:-timescaledb}
      - DB_POSTGRESDB_PORT=${DB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-athlete_metrics}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=Europe/Berlin
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - INTERVALS_KEY=${INTERVALS_KEY:-${API_KEY}}
      - HABITICA_USER_ID=${HABITICA_USER_ID}
      - HABITICA_API_TOKEN=${HABITICA_API_TOKEN}
      - HEVY_API_KEY=${HEVY_API_KEY}
      - NODE_OPTIONS=--max-old-space-size=4096
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change_me}
      - N8N_HOST=0.0.0.0
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows  # Workflows persistieren
      - ./certs:/certs:ro  # Optional: SSL-Zertifikate
    ports:
      - "5678:5678"

    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: 1.5
        reservations:
          memory: 1G
          cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


  # ============================================
  # Ollama (Lokale KI-Modelle) - OPTIMIERT FÜR 32 GB RAM
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"  # Nur lokal zugänglich!
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10G  # Für mistral-7b-instruct:q4_0 (~6.5 GB) + Puffer
          cpus: 3.0
        reservations:
          memory: 2G
          cpus: 1.0
    healthcheck:
      test: ["CMD", "ollama", "list"]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Ollama braucht länger zum Starten
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


  # ============================================
  # MCP-Server (Fitness-Datenquellen)
  # ============================================
  # Polar-MCP: https://github.com/NelsonNew/polar-mcp-server
  polar-mcp:
    build:
      context: ./mcp-servers/polar-mcp-server
      dockerfile: Dockerfile
    container_name: polar-mcp
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - POLAR_CLIENT_ID=${POLAR_CLIENT_ID:-dummy_id}
      - POLAR_CLIENT_SECRET=${POLAR_CLIENT_SECRET:-dummy_secret}
      - POLAR_REDIRECT_URI=http://127.0.0.1:3010/callback
    volumes:
      - ./mcp-servers/polar-mcp-server/tokens.json:/app/tokens.json
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


  # Intervals-MCP: https://github.com/mvilanova/intervals-mcp-server
  intervals-mcp:
    build:
      context: ./mcp-servers/intervals.icu-mcp-server
      dockerfile: Dockerfile
    container_name: intervals-mcp
    ports:
      - "127.0.0.1:3001:8000"
    environment:
      - INTERVALS_KEY=${INTERVALS_KEY:-dummy_key}
      - ATHLETE_ID=${ATHLETE_ID:-dummy_id}
      - MCP_TRANSPORT=http
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


  # Cronometer-MCP: https://github.com/modelcontextprotocol/servers/tree/main/src/cronometer
  cronometer-mcp:
    build:
      context: ./mcp-servers/cronometer
      dockerfile: Dockerfile
    container_name: cronometer-mcp
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      - CRONOMETER_USERNAME=${CRONOMETER_USERNAME:-dummy_user}
      - CRONOMETER_PASSWORD=${CRONOMETER_PASSWORD:-dummy_password}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - timescale_default
    dns:
      - 8.8.8.8
      - 1.1.1.1


