version: '3.8'

# --- Netzwerk-Konfiguration (isoliert für Sicherheit) ---
networks:
  app_network:
    driver: bridge
    internal: false  # Erlaubt Zugriff von Host (für Portainer/SSH), aber nicht von außen

# --- Volumes für persistente Daten ---
volumes:
  timescaledb_data:
    driver: local
  n8n_data:
    driver: local
  ollama_data:
    driver: local

# --- Services ---
services:
  # ============================================
  # TimescaleDB (PostgreSQL mit Timescale-Erweiterung)
  # ============================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-whoop_dashboard}
      - TIMESCALEDB_TELEMETRY=off  # Deaktiviert Telemetrie
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"  # Nur lokal zugänglich!
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G  # Reduziert für 16 GB RAM
          cpus: 1.5
        reservations:
          memory: 1G
          cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whoop_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # ============================================
  # n8n (Workflow-Automation)
  # ============================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    env_file:
      - .env
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=timescaledb
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=Europe/Berlin
      - NODE_OPTIONS=--max-old-space-size=2048  # Reduziert für 16 GB RAM
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change_me}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_HTTPS_CERT=/certs/fullchain.pem
      - N8N_HTTPS_KEY=/certs/privkey.pem
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows  # Workflows persistieren
      - ./certs:/certs:ro  # Optional: SSL-Zertifikate
    ports:
      - "127.0.0.1:5678:5678"  # Nur lokal zugänglich!
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G  # Reduziert für 16 GB RAM
          cpus: 1.0
        reservations:
          memory: 512M
          cpus: 0.25
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - app_network

  # ============================================
  # Ollama (Lokale KI-Modelle) - OPTIMIERT FÜR 16 GB RAM
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"  # Nur lokal zugänglich!
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G  # Für phi3:3.8b-mini-instruct-4k-fp16 (~3 GB) + Puffer
          cpus: 2.0
        reservations:
          memory: 1G
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Ollama braucht länger zum Starten
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_MAX_LOADED_MODELS=1  # Nur 1 Modell gleichzeitig laden
    networks:
      - app_network

  # ============================================
  # MCP-Server (Claude Desktop Integration)
  # ============================================
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    working_dir: /app
    env_file:
      - .env
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MCP_SERVER_PORT=3000
      - NODE_ENV=production
    volumes:
      - ./mcp-server:/app
    ports:
      - "127.0.0.1:3000:3000"  # Nur lokal zugänglich!
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M  # Reduziert für 16 GB RAM
          cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - app_network
